{{define "footer"}}
{{$cfg := siteConfig}}
<footer class="bg-white border-t border-[#E2E2DC] mt-12 py-8 text-xs text-[#55555B]">
    <div class="max-w-[1720px] mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-6">
        
        <!-- Left: Logo & Copyright -->
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 flex items-center justify-center p-0.5 shrink-0 bg-[#F6F5F0] rounded-xl border border-[#E2E2DC]">
                <img src="{{$cfg.SiteLogo}}" alt="{{$cfg.SiteName}} Logo" class="w-full h-full object-contain filter drop-shadow-sm" />
            </div>
            <div>
                <p class="font-bold text-[#1A1A1E] font-title">© 2026 {{$cfg.SiteName}} Anime Stream</p>
                <p class="text-[11px] text-[#55555B]">{{$cfg.SiteTagline}}</p>
            </div>
        </div>

        <!-- Right: Links -->
        <div class="flex items-center gap-4 text-[11px] font-bold font-title">
            <a href="/schedule" class="hover:text-[#1A1A1E] transition-colors">Jadwal Rilis</a>
            <a href="/popular" class="hover:text-[#1A1A1E] transition-colors">Anime Populer</a>
            <a href="/genres" class="hover:text-[#1A1A1E] transition-colors">Kategori Genre</a>
        </div>
    </div>
</footer>
{{end}}
